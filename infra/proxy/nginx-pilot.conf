worker_processes auto;
pid /tmp/nginx.pid;
# O error log padrão pode incluir a URL completa. O access log abaixo registra só o caminho.
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    client_max_body_size 2m;
    keepalive_timeout 65;
    map $uri $cache_policy { ~^/assets/ ""; default "no-store"; }
    server {
        # TLS termina no ngrok. A porta publicada por Compose aceita somente loopback.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $cache_policy always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; worker-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
        location /api/ {
            proxy_pass http://pilot-api:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cache off;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location = /sw.js {
            default_type application/javascript;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            types { application/manifest+json webmanifest; }
            default_type application/manifest+json;
            try_files $uri =404;
        }
        # Nenhuma raiz do workspace é montada; o painel serve apenas os arquivos compilados.
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
